# Schema for the configuration files of the core token system.

system.token:
  type: config_object
  label: 'Token settings'
  mapping:
    harden_placement:
      type: boolean
      label: 'Harden token placement'
      # When true, the placement gate blocks token chains it cannot statically
      # verify unless the author holds 'place unverifiable tokens'. New sites
      # default to true; existing sites are given false by
      # system_update_12002() during upgrade, so an upgrade does not change
      # unverifiable-chain save behaviour unannounced. This flag only ever
      # governs chains the gate cannot verify: a chain that verifiably reaches
      # data the author cannot access is always blocked regardless of this
      # value, in both the true and false states -- that branch is the
      # security fix and is intentional, not something either value relaxes.
